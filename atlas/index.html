:root{
  --papel:#FBF6EC; --cartao:#FFFDF8; --tinta:#2B3640; --suave:#55616A;
  --terracota:#B4532C; --verde:#467F35; --azul:#2A6690; --dourado:#B98114;
  --oceano:#D6E8F1; --terra:#F1E3C6; --borda:#D8CBB0; --linha:#E7DDC9;
  --certo:#2E7D32; --certo-bg:#E2F1DA; --errado:#A8321E; --errado-bg:#FBE4DE;
  --tam:21px;
}
html.maior{--tam:25px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--papel);color:var(--tinta)}
body{font:700 var(--tam)/1.45 "Nunito",system-ui,sans-serif;padding-inline:16px;padding-block:0 130px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:"Lora",Georgia,serif;font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
.tela{max-width:560px;margin:0 auto}
.topo{position:sticky;top:0;z-index:5;background:var(--papel);display:flex;align-items:center;gap:12px;padding-block:12px;margin-inline:-16px;padding-inline:16px;border-bottom:2px solid var(--linha);margin-bottom:18px}
.voltar{flex:none;border:3px solid var(--borda);background:var(--cartao);border-radius:16px;min-height:56px;padding:0 18px;font-weight:800}
.topo h2{font-size:1.1em}
.capa{text-align:center;padding-block:22px 6px}
.capa .sobre{font-size:.8em;letter-spacing:.12em;text-transform:uppercase;color:var(--terracota);font-weight:900}
.capa h1{font-size:2.05em;margin-top:6px}
.capa svg{width:min(78%,300px);height:auto;margin:14px auto 4px;display:block}
.recado{background:var(--cartao);border:3px solid var(--dourado);border-radius:22px;padding:18px 20px;margin:14px 0 22px;text-align:center}
.recado h2{font-size:1.3em;color:var(--terracota);margin-bottom:6px}
.recado p{margin:.3em 0}
.assina{font-family:"Lora",Georgia,serif;font-style:italic;color:var(--suave)}
.secao{font-family:"Lora",Georgia,serif;font-size:1.05em;color:var(--suave);margin:26px 4px 10px;display:flex;align-items:center;gap:10px}
.secao::after{content:"";flex:1;border-top:2px dotted var(--borda)}
.bloco{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--cartao);border:3px solid var(--linha);border-radius:22px;padding:14px 16px;margin-bottom:12px;min-height:88px}
.bloco:active{transform:scale(.985);border-color:var(--borda)}
.bloco .ic{flex:none;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:1.5em;background:var(--terra)}
.bloco b{display:block;font-size:1.05em;line-height:1.2}
.bloco small{display:block;font-size:.78em;color:var(--suave);font-weight:700;line-height:1.3;margin-top:2px}
.bloco .feito{margin-left:auto;flex:none;color:var(--certo);font-size:.9em}
.destaque{border-color:var(--terracota);background:#FFF6EE}
.contador{color:var(--suave);font-size:.85em;margin-bottom:6px}
.pergunta{font-family:"Lora",Georgia,serif;font-size:1.3em;line-height:1.3;margin:4px 0 16px}
.ouvir{border:3px solid var(--borda);background:var(--cartao);border-radius:999px;min-height:52px;padding:0 18px;margin-bottom:16px}
.opcao{display:block;width:100%;min-height:74px;text-align:left;background:var(--cartao);border:3px solid var(--borda);border-radius:18px;padding:12px 18px;margin-bottom:12px;font-size:1.05em;font-weight:800}
.opcao.certo{background:var(--certo-bg);border-color:var(--certo);color:var(--certo)}
.opcao.errado{background:var(--errado-bg);border-color:var(--errado);color:var(--errado)}
.opcao:disabled{opacity:1}
.opcao:disabled:not(.certo):not(.errado){opacity:.55}
.retorno{border-radius:18px;padding:14px 18px;margin:6px 0 16px;font-size:1em}
.retorno.certo{background:var(--certo-bg);color:#1F5A22}
.retorno.errado{background:#FFF1D6;color:#6B4A0E}
.retorno strong{display:block;font-size:1.15em}
.seguir{display:block;width:100%;min-height:76px;border:0;border-radius:18px;background:var(--terracota);color:#fff;font-weight:900;font-size:1.15em;margin-top:6px}
.seguir.azul{background:var(--azul)}
.leve{display:block;width:100%;min-height:64px;border:3px solid var(--borda);border-radius:18px;background:var(--cartao);font-weight:800;margin-top:12px}
.figura{background:#ECE6DA;border-radius:20px;padding:10px;margin-bottom:14px}
.figura.mar{background:var(--oceano);padding:0;overflow:hidden}
.figura svg{display:block;width:100%;height:auto}
.fim{text-align:center;padding-top:20px}
.fim .estrelas{font-size:2.4em;letter-spacing:.08em}
.fim h2{font-size:1.6em;margin:10px 0}
/* ligue */
.ligue{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ligue .col{display:flex;flex-direction:column;gap:10px}
.par{min-height:70px;border:3px solid var(--borda);background:var(--cartao);border-radius:16px;padding:8px 10px;font-weight:800;font-size:.9em;line-height:1.2}
.par.estado{background:#F3EEE3}
.par.marcado{border-color:var(--azul);background:#E3EEF6;box-shadow:0 0 0 3px #A9C9DF}
.par.ok{border-color:var(--certo);background:var(--certo-bg);color:var(--certo)}
.par.nao{animation:balanca .35s}
@keyframes balanca{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* letras */
.dica{color:var(--suave);font-size:.9em;margin-bottom:10px}
.resposta,.pecas{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:66px;margin:10px 0}
.resposta{border-bottom:3px dashed var(--borda);padding-bottom:12px}
.peca{width:48px;height:60px;border-radius:12px;border:3px solid var(--borda);background:var(--cartao);font-size:1.35em;font-weight:900}
.resposta .peca{background:#FFF4DC;border-color:var(--dourado)}
.resposta.ok .peca{background:var(--certo-bg);border-color:var(--certo);color:var(--certo)}
/* caça-palavras */
.grade{display:grid;gap:3px;background:var(--linha);padding:3px;border-radius:14px;touch-action:manipulation;user-select:none}
.cel{aspect-ratio:1;border:0;border-radius:7px;background:var(--cartao);font-weight:900;font-size:clamp(17px,5.2vw,26px);padding:0;display:grid;place-items:center}
.cel.inicio{background:#FFE08A}
.cel.achada{background:#CFE6C4;color:#1F5A22}
.lista{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.lista span{padding:6px 12px;border-radius:999px;background:var(--cartao);border:2px solid var(--linha);font-size:.85em}
.lista span.ok{background:var(--certo-bg);border-color:var(--certo);color:var(--certo);text-decoration:line-through}
.ajuda{font-size:.85em;color:var(--suave);margin:4px 0 12px}
/* família */
.historia p{margin:.5em 0}
.historia h3{font-size:1.2em;margin:18px 0 6px}
.historia .citacao{font-family:"Lora",Georgia,serif;font-style:italic;font-size:1.1em;text-align:center;color:var(--terracota);margin:18px 6px}
.legenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.8em;margin:-4px 4px 10px}
.legenda i{display:inline-block;width:26px;height:6px;border-radius:3px;vertical-align:middle;margin-right:6px}
.ajustes{display:flex;gap:10px;margin-top:26px}
.ajustes button{flex:1;min-height:60px;border:3px solid var(--borda);background:var(--cartao);border-radius:16px;font-weight:800;font-size:.85em}
/* festa */
.confete{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
.aviso{position:fixed;left:50%;top:86px;transform:translateX(-50%);z-index:40;background:var(--tinta);color:#fff;padding:12px 22px;border-radius:999px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.22);animation:entra .3s ease-out;white-space:nowrap}
.aviso.sai{opacity:0;transition:opacity .5s}
@keyframes entra{from{transform:translate(-50%,-14px);opacity:0}}
.chip{display:inline-block;background:#FFE7A8;color:#6B4A0E;border-radius:999px;padding:4px 14px;font-size:.85em;margin-top:8px}
/* trilha */
.heroi{display:block;width:100%;text-align:left;border:0;border-radius:24px;padding:18px 20px 20px;margin:4px 0 6px;color:#fff;background:linear-gradient(135deg,#467F35,#2A6690);box-shadow:0 6px 0 #1F4F6E}
.heroi:active{transform:translateY(3px);box-shadow:0 3px 0 #1F4F6E}
.heroi b{display:block;font-family:"Lora",Georgia,serif;font-size:1.35em}
.heroi small{display:block;opacity:.95}
.heroi .jogar{display:inline-block;margin-top:12px;background:#FFD34D;color:#4A3200;border-radius:999px;padding:10px 22px;font-weight:900;box-shadow:0 4px 0 #C99A12}
.trilha{position:relative;margin-inline:-16px;overflow:hidden}
.trilha svg{position:absolute;inset:0;width:100%;height:100%}
.no{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:5px solid #fff;font-size:1.2em;font-weight:900;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2);display:grid;place-items:center;padding:0}
.no.fechada{background:#BDB6AA;color:#F4F1EA}
.no.feita{background:var(--verde)}
.no.atual{background:var(--terracota);animation:pulsa 1.2s ease-in-out infinite}
@keyframes pulsa{50%{transform:scale(1.13)}}
.no .est{position:absolute;top:70px;left:50%;transform:translateX(-50%);font-size:.6em;white-space:nowrap;letter-spacing:-.08em}
.mundo{position:absolute;left:16px;right:16px;text-align:center;font-family:"Lora",Georgia,serif;background:rgba(255,253,248,.94);border-radius:16px;padding:6px 10px;border:2px solid var(--linha)}
.enfeite{position:absolute;font-size:1.6em;opacity:.6;transform:translate(-50%,-50%)}
.voce{position:absolute;transform:translate(-50%,-128%);font-size:1.5em;animation:pulinho 1s ease-in-out infinite;pointer-events:none}
@keyframes pulinho{50%{margin-top:-8px}}
.completa .estrelas span{display:inline-block;animation:estrela .55s cubic-bezier(.3,1.6,.5,1) both}
.completa .estrelas span:nth-child(2){animation-delay:.25s}.completa .estrelas span:nth-child(3){animation-delay:.5s}
.completa .estrelas .apagada{filter:grayscale(1);opacity:.3}
@keyframes estrela{from{transform:scale(0) rotate(-70deg)}}
/* jogo da memória */
.placar{display:flex;justify-content:space-between;font-size:.9em;color:var(--suave);margin:0 2px 12px}
.cartas{display:grid;gap:10px;perspective:900px}
.carta{position:relative;aspect-ratio:5/6;border:0;padding:0;background:none}
.carta .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.carta.virada .in,.carta.par .in{transform:rotateY(180deg)}
.carta .costas,.carta .frente{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;align-content:center;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.carta .costas{background:repeating-linear-gradient(45deg,#B4532C 0 8px,#A34924 8px 16px);border:4px solid #fff;font-size:1.7em}
.carta .frente{transform:rotateY(180deg);background:#FFFDF8;border:3px solid var(--borda);padding:6px;text-align:center;line-height:1.15;font-weight:900;font-size:clamp(14px,4.3vw,19px);overflow:hidden}
.carta .frente .emo{display:block;font-size:2.1em;line-height:1.1}
.carta .frente small{display:block;font-size:.6em;color:var(--suave);letter-spacing:.06em;margin-bottom:4px}
.carta.par .frente{border-color:var(--certo);background:var(--certo-bg);color:#1F5A22}
/* combina 3 */
.meta3{display:flex;gap:10px;margin-bottom:12px}
.meta3 div{flex:1;background:var(--cartao);border:3px solid var(--linha);border-radius:16px;text-align:center;padding:6px}
.meta3 b{display:block;font-size:1.35em;line-height:1.15}
.meta3 small{font-size:.75em;color:var(--suave)}
.tabuleiro{display:grid;gap:4px;background:#2A6690;padding:6px;border-radius:18px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.peca3{aspect-ratio:1;border:0;border-radius:10px;background:rgba(255,255,255,.92);font-size:clamp(22px,7.2vw,34px);padding:0;display:grid;place-items:center;line-height:1}
.peca3.sel{background:#FFE08A;box-shadow:0 0 0 4px #FFD34D inset}
.peca3.some{animation:some .28s forwards}
@keyframes some{to{transform:scale(0);opacity:0}}
.peca3.cai{animation:cai .3s ease-in both}
@keyframes cai{from{transform:translateY(var(--de))}}
.peca3.nao{animation:balanca .3s}
/* ajudante de voz */
[hidden]{display:none!important}
.fab{position:fixed;right:14px;bottom:18px;z-index:30;width:84px;height:84px;border-radius:50%;border:4px solid #fff;background:var(--azul);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1}
.fab span{font-size:1.55em}
.fab small{font-size:13px;font-weight:900;margin-top:3px}
.ajudante{position:fixed;inset:0;z-index:60;background:rgba(43,54,64,.5);display:flex;align-items:flex-end}
.ajudante .folha{background:var(--papel);width:100%;max-width:560px;margin:0 auto;border-radius:26px 26px 0 0;padding:20px 18px 26px;max-height:90vh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.ajudante h2{font-size:1.35em;margin-bottom:4px;text-align:center}
.ajudante .dica{text-align:center}
.mic{display:block;margin:10px auto 8px;width:112px;height:112px;border-radius:50%;border:0;background:var(--terracota);color:#fff;font-size:2.8em;box-shadow:0 6px 0 #8C3F20;padding:0}
.mic.ouvindo{background:var(--verde);box-shadow:0 0 0 14px rgba(70,127,53,.25);animation:pulsa 1s ease-in-out infinite}
.falado{text-align:center;color:var(--suave);font-style:italic;min-height:1.4em;margin:4px 0 10px}
.fala-ia{background:var(--cartao);border:3px solid var(--azul);border-radius:18px;padding:14px 16px;margin:6px 0 10px;font-size:1.05em}
.sugestoes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:6px 0 4px}
.sugestoes button{border:2px solid var(--borda);background:var(--cartao);border-radius:999px;padding:10px 14px;font-weight:800;font-size:.82em}
</style>
</head>

function embaralha(arr, rnd = Math.random) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let audio;
function tons(freqs, passo = 0.13, vol = 0.2) {
  if (!guarda.ler("som", true)) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * passo;
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.45);
    });
  } catch (e) {}
}
const som = () => tons([660, 880]);
const fanfarra = () => tons([523, 659, 784, 1047], 0.14, 0.22);
function acertou() { som(); marcaDia(); }
const estrelasPor = (certos, total) => certos >= total ? 3 : certos / total >= 0.6 ? 2 : 1;

const semMovimento = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function confete(qtd = 110) {
  if (semMovimento) return;
  const cv = document.createElement("canvas"), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.className = "confete"; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  document.body.appendChild(cv);
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const cores = ["#B4532C", "#D8A23E", "#467F35", "#2A6690", "#E7A59B", "#FFD34D"];
  const ps = Array.from({length: qtd}, () => ({x: innerWidth / 2 + (Math.random() - .5) * 90, y: innerHeight * .38,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 5, r: Math.random() * 7 + 6, a: Math.random() * 6,
    va: (Math.random() - .5) * .3, c: cores[Math.floor(Math.random() * cores.length)]}));
  const t0 = performance.now();
  (function passo(t) {
    g.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.vy += .34; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r / 2, -p.r / 3, p.r, p.r * .66); g.restore(); });
    if (t - t0 < 2800) requestAnimationFrame(passo); else cv.remove();
  })(t0);
}
function aviso(txt) {
  const el = document.createElement("div");
  el.className = "aviso"; el.textContent = txt;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add("sai"), 1600); setTimeout(() => el.remove(), 2200);
}
// dias seguidos jogando
function marcaDia() {
  const hoje = numeroDoDia(), d = guarda.ler("dias", {ultimo: 0, seguidos: 0});
  if (d.ultimo === hoje) return;
  d.seguidos = d.ultimo === hoje - 1 ? d.seguidos + 1 : 1; d.ultimo = hoje;
  guarda.gravar("dias", d);
  if (d.seguidos >= 2) setTimeout(() => aviso(`🔥 ${d.seguidos} dias seguidos jogando!`), 900);
}
function chipDias() {
  const d = guarda.ler("dias", {ultimo: 0, seguidos: 0});
  return d.ultimo >= numeroDoDia() - 1 && d.seguidos >= 2 ? `<div class="chip">🔥 ${d.seguidos} dias seguidos jogando</div>` : "";
}
const temVoz = "speechSynthesis" in window;
function calar() { if (temVoz) speechSynthesis.cancel(); }
function falar(txt) {
  if (!temVoz) return;
  try {
    calar();
    const u = new SpeechSynthesisUtterance(txt), vozes = speechSynthesis.getVoices();
    u.lang = "pt-BR"; u.rate = 0.9;
    const v = vozes.find(v => /^pt[-_]BR/i.test(v.lang)) || vozes.find(v => /^pt/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------- motor das perguntas ----------
const ELOGIOS = ["Isso mesmo, vó!", "Muito bem!", "Acertou!", "Que memória!", "Certinho!", "Parabéns!"];
function jogoQuiz({titulo, lista, aoTerminar, deNovo = true, nota = "", pai = "", aoFim}) {
  let i = 0, acertos = 0, seguidas = 0;
  function mostra() {
    const q = lista[i], ops = q.o || ["Verdade", "Mentira"];
    app.innerHTML = topo(titulo, pai) + `
      <div class="contador">Pergunta ${i + 1} de ${lista.length}</div>
      ${q.fig ? `<div class="figura">${q.fig}</div>` : ""}
      <div class="pergunta">${esc(q.p)}</div>
      ${temVoz ? `<button class="ouvir" id="ouvir">🔊 Ouvir</button>` : ""}
      <div id="ops">${ops.map((o, k) => `<button class="opcao" data-k="${k}">${esc(o)}</button>`).join("")}</div>
      <div id="depois"></div>`;
    const b = document.getElementById("ouvir");
    if (b) b.onclick = () => falar(q.p + ". " + ops.join(". "));
    document.querySelectorAll(".opcao").forEach(el => el.onclick = () => responde(+el.dataset.k));
  }
  function responde(k) {
    const q = lista[i], ok = k === q.r;
    if (ok) {
      acertos++; seguidas++; acertou();
      if (seguidas === 3) aviso("🔥 3 seguidas!");
      else if (seguidas === 5) aviso("🔥 5 seguidas! Que memória!");
    } else seguidas = 0;
    document.querySelectorAll(".opcao").forEach((el, n) => {
      el.disabled = true;
      if (n === q.r) el.classList.add("certo");
      else if (n === k) el.classList.add("errado");
    });
    const d = document.getElementById("depois");
    d.innerHTML = `<div class="retorno ${ok ? "certo" : "errado"}"><strong>${ok ? ELOGIOS[Math.floor(Math.random() * ELOGIOS.length)] : "Não foi dessa vez."}</strong>${esc(q.x || "")}</div>
      <button class="seguir" id="seguir">${i + 1 < lista.length ? "Próxima →" : "Ver como foi"}</button>`;
    document.getElementById("seguir").onclick = () => { i++; window.scrollTo(0, 0); i < lista.length ? mostra() : fim(); };
    d.scrollIntoView({behavior: "smooth", block: "nearest"});
  }
  function fim() {
    if (aoTerminar) aoTerminar(acertos);
    if (aoFim) return aoFim(estrelasPor(acertos, lista.length));
    if (acertos === lista.length) { confete(); fanfarra(); }
    const n = estrelasPor(acertos, lista.length);
    app.innerHTML = topo(titulo, pai) + `<div class="fim"><div class="estrelas">${"⭐".repeat(n)}</div>
      <h2>Acertou ${acertos} de ${lista.length}!</h2><p>${nota || (acertos === lista.length ? "Não errou nenhuma!" : "Cada partida é uma viagem nova.")}</p>
      ${deNovo ? `<button class="seguir" onclick="rota()">Jogar de novo</button>` : ""}
      <button class="leve" onclick="voltarInicio()">Voltar ao início</button></div>`;
  }
  mostra();
}

const CORES = {terra: "#F1E3C6", borda: "#A8977A", destaque: "#B4532C"};
const PEQUENOS = ["DF", "SE", "AL", "RJ", "ES", "RN", "PB"];
function svgBrasil(sigla, ehCapa) {
  const B = GEO.brasil, ufs = B.ufs.slice().sort((a, b) => (a.sigla === sigla) - (b.sigla === sigla));
  const caminhos = ufs.map(u => `<path d="${u.d}" fill="${u.sigla === sigla ? CORES.destaque : CORES.terra}" stroke="${ehCapa ? "#C9B78F" : CORES.borda}" stroke-width="${ehCapa ? 2 : 2.2}" stroke-linejoin="round"/>`).join("");

function jogoLigue(regiao, op = {}) {

function jogoLetras(idx, op = {}) {

// ---------- caça-palavras ----------
const TAM = 10;
function montaGrade(palavras, rnd) {
  for (let tent = 0; tent < 300; tent++) {
    const g = Array.from({length: TAM}, () => Array(TAM).fill("")), pos = {};
    let ok = true;
    for (const w of palavras.slice().sort((a, b) => b.length - a.length)) {
      let colocou = false;
      for (let k = 0; k < 400 && !colocou; k++) {
        const [dl, dc] = rnd() < 0.5 ? [0, 1] : [1, 0];
        const l = Math.floor(rnd() * (TAM - dl * (w.length - 1))), c = Math.floor(rnd() * (TAM - dc * (w.length - 1)));
        let cabe = true;
        for (let j = 0; j < w.length; j++) { const x = g[l + dl * j][c + dc * j]; if (x && x !== w[j]) { cabe = false; break; } }
        if (!cabe) continue;
        pos[w] = [];
        for (let j = 0; j < w.length; j++) { g[l + dl * j][c + dc * j] = w[j]; pos[w].push((l + dl * j) * TAM + c + dc * j); }
        colocou = true;
      }
      if (!colocou) { ok = false; break; }
    }
    if (ok) {
      const AL = "AAABCDEEEFGILMNOOPRRSSTUV";
      g.forEach(lin => lin.forEach((x, c) => { if (!x) lin[c] = AL[Math.floor(rnd() * AL.length)]; }));
      return {letras: g.flat(), pos};
    }
  }
}
function jogoCaca(idx, op = {}) {
  const fase = !!op.aoFim, cart = CACAS[idx], {letras, pos} = montaGrade(cart.w, semente((fase ? 500 : 100) + idx));
  const achadas = new Set(fase ? [] : guarda.ler("caca-achadas-" + idx, []));
  let inicioSel = null, terminou = false;
  app.innerHTML = topo(op.titulo || cart.t, op.pai ?? "caca") + `${fase ? `<p class="dica">${cart.t}</p>` : ""}<p class="ajuda">Toque na <b>primeira</b> letra de uma palavra e depois na <b>última</b>. As palavras estão deitadas (→) ou em pé (↓).</p>
    <div class="grade" style="grid-template-columns:repeat(${TAM},1fr)">${letras.map((l, k) => `<button class="cel" data-k="${k}">${l}</button>`).join("")}</div>
    <div class="lista">${cart.w.map(w => `<span data-w="${w}">${w}</span>`).join("")}</div><div id="depois"></div>`;
  const cels = [...app.querySelectorAll(".cel")];
  function pinta() {
    cels.forEach(c => c.classList.remove("achada"));
    achadas.forEach(w => pos[w].forEach(k => cels[k].classList.add("achada")));
    app.querySelectorAll(".lista span").forEach(s => s.classList.toggle("ok", achadas.has(s.dataset.w)));
    if (achadas.size === cart.w.length && !terminou) {
      terminou = true;
      if (fase) return setTimeout(() => op.aoFim(3), 700);
      guarda.gravar("caca-" + idx, true); confete(); fanfarra();
      const prox = CACAS[idx + 1] ? `<button class="seguir" onclick="location.replace('#caca/${idx + 1}')">Próxima cartela →</button>` : "";
      mostraFinal(`<div class="retorno certo"><strong>Achou todas! 🎉</strong>Cartela completinha.</div>${prox}<button class="leve" onclick="voltar('caca')">Ver as cartelas</button>`);
    }
  }
  cels.forEach(cel => cel.onclick = () => {
    const k = +cel.dataset.k;
    if (inicioSel === null) { inicioSel = k; cel.classList.add("inicio"); return; }
    const a = inicioSel;
    cels[a].classList.remove("inicio"); inicioSel = null;
    if (a === k) return;
    const [la, ca, lk, ck] = [Math.floor(a / TAM), a % TAM, Math.floor(k / TAM), k % TAM];
    if (la !== lk && ca !== ck) { inicioSel = k; cel.classList.add("inicio"); return; }
    const passo = la === lk ? 1 : TAM, [ini, fimK] = a < k ? [a, k] : [k, a], trecho = [];
    for (let x = ini; x <= fimK; x += passo) trecho.push(x);
    const achou = cart.w.find(w => !achadas.has(w) && pos[w].length === trecho.length && pos[w].every((p, j) => p === trecho[j]));
    if (achou) {
      achadas.add(achou); acertou();
      if (!fase) guarda.gravar("caca-achadas-" + idx, [...achadas]);
      pinta();
    } else { cel.classList.add("inicio"); setTimeout(() => cel.classList.remove("inicio"), 350); }
  });

ROTAS.caca = idx => CACAS[idx] ? jogoCaca(+idx) : menu("Caça-palavras", "Escolha uma cartela:",

// ---------- combina 3 da natureza ----------
const FIGURAS = ["🌊", "🌲", "🍌", "🌻", "🐚"], L3 = 7;
function jogoCombina(op = {}) {
  const sorteiaFig = () => FIGURAS[Math.floor(Math.random() * FIGURAS.length)];

  function novoTab() {

      for (let k = 0; k < L3 * L3; k++) {

        do { f = sorteiaFig(); } while ((k % L3 >= 2 && t[k - 1] === f && t[k - 2] === f) || (k >= 2 * L3 && t[k - L3] === f && t[k - 2 * L3] === f));

    }

  function desenha(somem = new Set(), caem = {}) {
    document.getElementById("tab").innerHTML = tab.map((f, k) => `<button class="peca3${sel === k ? " sel" : ""}${somem.has(k) ? " some" : ""}${caem[k] ? " cai" : ""}" data-k="${k}"${caem[k] ? ` style="--de:${-caem[k] * 108}%"` : ""}>${f}</button>`).join("");
    document.getElementById("jog").textContent = jogadas;
    document.getElementById("junto").textContent = `${Math.min(junto, meta)} de ${meta}`;
  }
  async function troca(a, b) {
    if (ocupado || acabou) return;
    ocupado = true; sel = null;
    [tab[a], tab[b]] = [tab[b], tab[a]]; desenha();
    let g = grupos(tab);
    if (!g.s.size) {

      const el = document.querySelector(`.peca3[data-k="${b}"]`); if (el) el.classList.add("nao");

    mostraFinal(`<div class="retorno certo" style="margin-top:16px"><strong>Conseguiu! 🎉</strong>Juntou ${meta} ${alvo} e ainda sobraram ${jogadas} jogadas.</div>
      <button class="seguir" onclick="rota()">Jogar de novo</button><button class="leve" onclick="voltarInicio()">Voltar ao início</button>`);
  }
  function semJogadas() {
    acabou = true;
    mostraFinal(`<div class="retorno errado" style="margin-top:16px"><strong>Faltou pouquinho!</strong>Faltaram só ${meta - junto} ${alvo}.</div>
      ${extra ? "" : `<button class="seguir azul" id="mais5">Ganhar mais 5 jogadas</button>`}<button class="leve" onclick="rota()">Começar de novo</button>`);
    const b = document.getElementById("mais5");
    if (b) b.onclick = () => { extra = true; jogadas = 5; acabou = false; ocupado = false; document.getElementById("depois").innerHTML = ""; desenha(); window.scrollTo(0, 0); };
  }

  app.innerHTML = topo(op.titulo || "Combina 3 da natureza", op.pai ?? "") + `
    <p class="ajuda">Toque numa figura e depois na vizinha pra trocar as duas de lugar. Junte 3 iguais em fila!</p>
    <div class="meta3"><div><small>Juntar ${alvo}</small><b id="junto"></b></div><div><small>Jogadas</small><b id="jog"></b></div></div>
    <div class="tabuleiro" id="tab" style="grid-template-columns:repeat(${L3},1fr)"></div><div id="depois"></div>`;
  desenha();

    desenha();
  });
}

  if (tem("volt", "inicio", "comeco", "sair", "menu", "perdi", "onde estou", "onde eu to", "onde to", "principal")) {
    if (emCasa) return {fala: "A senhora já está na tela inicial. É só tocar num jogo pra começar."};
    return {fala: `Agora a senhora está ${ondeEstou()}. Pra voltar, toque no botão Voltar, lá em cima, do lado esquerdo.`,
      acoes: [{t: "Me leva pro começo 🏠", f: () => { fechaAjudante(); ir(""); }}]};
  }
  if (tem("como", "nao sei", "nao entend", "explica", "ensina", "o que faco", "o que eu faco", "ajuda", "socorro", "dificil")) return {fala: COMO[tela]};
  if (pal("oi", "ola") || tem("bom dia", "boa tarde", "boa noite")) return {fala: `${saudacao()}, vó Maria! Pode me perguntar como jogar, como voltar, ou pedir pra abrir um jogo.`};
  if (tem("internet")) return {fala: "Depois da primeira vez, o atlas funciona até sem internet. Só pra me ouvir é que o celular precisa de internet."};
  return {fala: "Desculpa, vó, essa eu não entendi. Tente falar de outro jeito, ou toque numa das dúvidas aqui embaixo."};
}

document.body.insertAdjacentHTML("beforeend", `
  <button class="fab" id="fab" aria-label="Ajuda por voz"><span>🎤</span><small>Ajuda</small></button>
  <div class="ajudante" id="ajudante" hidden><div class="folha" role="dialog" aria-label="Ajudante">
    <h2>Posso ajudar, vó? 😊</h2>
    <p class="dica" id="aj-estado"></p>
    ${Reconhece ? `<button class="mic" id="aj-mic" aria-label="Falar">🎤</button><div class="falado" id="aj-falado"></div>` : ""}
    <div id="aj-resposta"></div>
    <p class="dica">${Reconhece ? "Ou toque numa dúvida:" : "Toque numa dúvida:"}</p>
    <div class="sugestoes">${SUGESTOES.map(s => `<button>${s}</button>`).join("")}</div>
    <button class="leve" id="aj-fechar">Fechar</button>
  </div></div>`);
const $a = id => document.getElementById(id);
let reconhecendo = null;

function abreAjudante() {
  calar();
  $a("ajudante").hidden = false; $a("fab").hidden = true;
  $a("aj-resposta").innerHTML = "";
  if ($a("aj-falado")) $a("aj-falado").textContent = "";
  $a("aj-estado").textContent = Reconhece ? "Toque no microfone e fale a sua dúvida." : "";
  if (Reconhece) escuta();
}
function fechaAjudante() {
  if (reconhecendo) { try { reconhecendo.abort(); } catch (e) {} reconhecendo = null; }
  $a("ajudante").hidden = true; $a("fab").hidden = false;
  if ($a("aj-mic")) $a("aj-mic").classList.remove("ouvindo");
}
function escuta() {
  if (reconhecendo || !Reconhece) return;
  calar();
  const rec = new Reconhece(), mic = $a("aj-mic");
  let final = "", erro = "";
  rec.lang = "pt-BR"; rec.interimResults = true; rec.maxAlternatives = 1;
  rec.onstart = () => { mic.classList.add("ouvindo"); $a("aj-estado").textContent = "Estou ouvindo… pode falar!"; };
  rec.onresult = e => {
    const txt = [...e.results].map(r => r[0].transcript).join(" ");
    $a("aj-falado").textContent = "“" + txt + "”";
    if (e.results[e.results.length - 1].isFinal) final = txt;
  };
  rec.onerror = e => { erro = e.error; };
  rec.onend = () => {
    reconhecendo = null; mic.classList.remove("ouvindo");
    if (final) return mostraResposta(final);
    if (erro === "aborted" || $a("aj-resposta").innerHTML) return;
    $a("aj-estado").textContent = erro === "not-allowed" || erro === "service-not-allowed" ? "O celular não deixou usar o microfone. Peça pra Sabrina liberar o microfone pro atlas."
      : erro === "network" ? "Pra me ouvir, o celular precisa de internet. Mas dá pra tocar numa dúvida aqui embaixo."
      : "Não consegui ouvir. Toque no microfone e fale pertinho do celular.";
  };
  reconhecendo = rec;
  try { rec.start(); } catch (e) { reconhecendo = null; }
}
function mostraResposta(txt) {
  const r = entende(txt);
  if (!r) return;
  const caixa = $a("aj-resposta"), acoes = r.acoes || [];
  $a("aj-estado").textContent = "";
  caixa.innerHTML = `<div class="fala-ia">${esc(r.fala)}</div>` + acoes.map((a, i) => `<button class="seguir azul" data-a="${i}">${esc(a.t)}</button>`).join("")
    + (Reconhece ? `<button class="leve" id="aj-denovo">🎤 Perguntar outra coisa</button>` : "");
  acoes.forEach((a, i) => caixa.querySelector(`[data-a="${i}"]`).onclick = a.f);
  const d = $a("aj-denovo");
  if (d) d.onclick = () => { caixa.innerHTML = ""; $a("aj-falado").textContent = ""; escuta(); };
  falar(r.fala.replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu, ""));
}

$a("fab").onclick = abreAjudante;
$a("aj-fechar").onclick = () => { calar(); fechaAjudante(); };
$a("ajudante").onclick = e => { if (e.target.id === "ajudante") { calar(); fechaAjudante(); } };
if ($a("aj-mic")) $a("aj-mic").onclick = escuta;
document.querySelectorAll(".sugestoes button").forEach(b => b.onclick = () => {
  if (reconhecendo) { try { reconhecendo.abort(); } catch (e) {} }
  if ($a("aj-falado")) $a("aj-falado").textContent = "“" + b.textContent + "”";
  mostraResposta(b.textContent);
});
window.addEventListener("hashchange", () => { if (!$a("ajudante").hidden) fechaAjudante(); });

document.head.insertAdjacentHTML("beforeend", `<style>

.lugares b{display:block}
</style>`);

// projeção de Miller igual à do gerar_geo.py (caixa -62..20 de longitude, -36..52 de latitude)
function projCaminhos(lon, lat) {
  const rad = g => g * Math.PI / 180, miller = g => 1.25 * Math.log(Math.tan(Math.PI / 4 + 0.4 * rad(g)));
  const k = 1000 / rad(82);
  return [+(rad(lon + 62) * k).toFixed(1), +((miller(52) - miller(lat)) * k).toFixed(1)];
}
function curva(pts) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}
function rotulo(x, y, txt, anc = "start", tam = 40, cor = "#2B3640", peso = 900) {
  return `<text x="${x}" y="${y}" font-size="${tam}" text-anchor="${anc}" fill="${cor}" stroke="#FFFDF8" stroke-width="${tam / 4}" paint-order="stroke" stroke-linejoin="round" font-family="Nunito,sans-serif" font-weight="${peso}">${txt}</text>`;
}
const pino = (p, cor, r = 14) => `<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${cor}" stroke="#fff" stroke-width="6"/>`;

function svgCaminhos() {
  const C = GEO.caminhos, pj = ll => projCaminhos(ll[0], ll[1]);
  const acores = pj([-27.22, 38.72]), belluno = pj([12.22, 46.14]), ilha = pj([-48.52, -27.6]), rio = pj([-43.2, -22.9]), jaragua = pj([-49.07, -26.49]);
  const garcia = curva([[-27.22, 38.72], [-33, 16], [-31.5, -8], [-43, -27.2], [-48.52, -27.6]].map(pj));
  const schiochet = curva([[12.22, 46.14], [8.93, 44.41], [-6.2, 35.9], [-21, 12], [-28, -10], [-38.5, -21.5], [-43.2, -22.9], [-47.3, -26.1], [-49.07, -26.49]].map(pj));
  const linha = (d, cor, tr) => `<path d="${d}" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity=".8"/><path d="${d}" fill="none" stroke="${cor}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${tr}"/>`;
  return `<svg viewBox="0 0 ${C.w} ${C.h}" role="img" aria-label="Mapa dos caminhos da família pelo Oceano Atlântico">
    <rect width="${C.w}" height="${C.h}" fill="#D6E8F1"/>
    <path d="${C.terra}" fill="#F1E3C6" stroke="#CDBB97" stroke-width="1.5" stroke-linejoin="round"/>
    ${rotulo(640, 880, "OCEANO", "middle", 34, "#5E8AA3", 800)}${rotulo(640, 920, "ATLÂNTICO", "middle", 34, "#5E8AA3", 800)}
    ${rotulo(150, 760, "BRASIL", "middle", 34, "#9A8660", 800)}${rotulo(760, 520, "ÁFRICA", "middle", 34, "#9A8660", 800)}${rotulo(700, 48, "EUROPA", "middle", 34, "#9A8660", 800)}
    ${linha(garcia, "#B4532C", "2 22")}${linha(schiochet, "#2A6690", "24 16")}
    ${pino(acores, "#B4532C")}${pino(belluno, "#2A6690")}${pino(rio, "#2A6690", 10)}${pino(ilha, "#B4532C")}${pino(jaragua, "#2A6690")}
    ${rotulo(acores[0] + 24, acores[1] + 12, "Açores")}${rotulo(belluno[0] - 8, belluno[1] - 26, "Belluno", "middle")}
    ${rotulo(rio[0] + 22, rio[1] + 40, "Rio de Janeiro", "start", 30, "#2B3640", 800)}
    ${rotulo(ilha[0] + 4, ilha[1] + 62, "Santa Catarina", "start", 36)}
  </svg>`;
}

const LUGARES = [
  ["Corupá", "end", -34, 12, "Onde a vó e o vô se casaram, em 1965, e onde nasceram os filhos."],
  ["Jaraguá do Sul", "start", 36, 12, "Nereu Ramos e a Capela Santo Antônio, onde a família criou raiz."],
  ["Joinville", "start", 36, 12, "Onde a Zita, mãe da vó, aprendeu a costurar ternos."],

];
function svgVida() {
  const V = GEO.vida;
  const pinos = LUGARES.map(([nome, anc, dx, dy], i) => {

      ${rotulo(x + dx, y + dy, nome, anc, 40)}`;
  }).join("");
  return `<svg viewBox="0 0 ${V.w} ${V.h}" role="img" aria-label="Mapa dos lugares da vida da vó Maria">
    <rect width="${V.w}" height="${V.h}" fill="#D6E8F1"/>
    <path d="${V.pr}" fill="#E9E1CF" stroke="#CDBB97" stroke-width="2"/>
    <path d="${V.mun}" fill="#F1E3C6" stroke="#D5C5A3" stroke-width="1.6" stroke-linejoin="round"/>
    ${rotulo(170, 70, "PARANÁ", "middle", 34, "#9A8660", 800)}
    ${rotulo(880, 560, "OCEANO", "middle", 32, "#5E8AA3", 800)}${rotulo(880, 598, "ATLÂNTICO", "middle", 32, "#5E8AA3", 800)}
    ${pinos}</svg>`;
}
